<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Leaflet line and points with graphics</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

  <!-- Load Leaflet from CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
    crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
    integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
    crossorigin=""></script>

  <!-- Load Esri Leaflet from CDN (kept for consistency with the other examples) -->
  <script src="https://unpkg.com/esri-leaflet@2.5.0/dist/esri-leaflet.js"
    integrity="sha512-ucw7Grpc+iEQZa711gcjgMBnmd9qju1CICsRaryvX7HJklK0pGl/prxKvtHwpgm5ZHdvAil7YPxI1oWPOWK3UQ=="
    crossorigin=""></script>

  <!-- Load proj4js from CDN to reproject EPSG:25833 coordinates to WGS84 -->
  <script src="https://unpkg.com/proj4@2.9.0/dist/proj4.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      left: 0;
    }

    .point-icon-frame {
      border: 2px solid #000000;
      border-radius: 6px;
      box-sizing: border-box;
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
    }

    .leaflet-popup-content-wrapper {
      padding: 1;
    }

    .leaflet-popup-content {
      margin: 6px 10px;
      line-height: 1.3;
    }

    .omraade-label {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
      text-shadow:
        -1px -1px 0 #000000,
        1px -1px 0 #000000,
        -1px 1px 0 #000000,
        1px 1px 0 #000000;
      white-space: nowrap;
      text-align: center;
    }

    .background-toggle-button {
      background: white;
      border: 2px solid rgba(0, 0, 0, 0.2);
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="js/line_and_points_with_graphics.js"></script>
</body>
</html>
